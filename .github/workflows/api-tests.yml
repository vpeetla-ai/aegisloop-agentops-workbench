name: api-tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: vpeetla-ai/golden-eval-registry
          path: golden-eval-registry
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime
        run: pip install -e .
      - name: Install golden-eval-registry (shared eval fixtures + scorer)
        run: pip install -e ../../golden-eval-registry
      - name: Run tests (includes the real golden-eval-registry merge gate)
        env:
          GOLDEN_EVAL_REGISTRY_PATH: ${{ github.workspace }}/golden-eval-registry
        run: PYTHONPATH=src python -m unittest discover -s tests -v
