[build]
  publish = "app"
  command = "npm run build"

[functions]
  directory = "infra/netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/missions/run"
  to = "/.netlify/functions/mission-run"
  status = 200

# When AGENT_LOOP_API_URL is set on Netlify, mission-run.ts proxies to the full FastAPI runtime.
# For streaming missions, point the UI directly at AGENT_LOOP_API_URL/api/missions/stream.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
