services:
  - type: web
    name: aegisloop-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./services/api/Dockerfile
    dockerContext: ./services/api
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: ALLOWED_ORIGINS
        value: https://venkat-ai.com,https://www.venkat-ai.com
      - key: DATABASE_URL
        sync: false
